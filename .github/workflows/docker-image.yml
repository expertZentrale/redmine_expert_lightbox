name: Docker image smoke test

# Complements the source based CI (ci.yml): tests the plugin against the
# *official* Redmine Docker images (https://hub.docker.com/_/redmine) - the very
# images we deploy with. For each tag the official image is started with a fresh
# MariaDB, the plugin is mounted in and migrated via REDMINE_PLUGINS_MIGRATE.
#
# The official entrypoint runs with `set -Eeo pipefail`: if a core or plugin
# migration fails, or init.rb raises while loading, the container exits and the
# site never comes up. A successful `/login` (HTTP 200) therefore proves that the
# plugin loads cleanly in the production image. On top of that we fetch a
# rendered page and assert the head hook injected the config island, the script
# and the stylesheet - which is what this plugin's whole point depends on.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: redmine:${{ matrix.tag }} (official image)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Currently published, supported Redmine tags on Docker Hub.
        tag: [ '5.1', '6.0', '6.1', '7.0' ]

    env:
      DB_NAME: redmine
      DB_PASS: root

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: redmine_expert_lightbox

      - name: Create docker network
        run: docker network create rmnet

      - name: Start MariaDB
        run: |
          docker run -d --name db --network rmnet \
            -e MARIADB_ROOT_PASSWORD="$DB_PASS" \
            -e MARIADB_DATABASE="$DB_NAME" \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            mariadb:11.4 --transaction-isolation=READ-COMMITTED

      - name: Wait for MariaDB to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' db 2>/dev/null || echo starting)
            echo "attempt $i: db health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "MariaDB did not become healthy in time"; docker logs db; exit 1

      - name: Start official Redmine ${{ matrix.tag }} with the plugin
        run: |
          docker run -d --name redmine --network rmnet -p 3000:3000 \
            -e REDMINE_DB_MYSQL=db \
            -e REDMINE_DB_DATABASE="$DB_NAME" \
            -e REDMINE_DB_USERNAME=root \
            -e REDMINE_DB_PASSWORD="$DB_PASS" \
            -e REDMINE_PLUGINS_MIGRATE=1 \
            -v "$GITHUB_WORKSPACE/redmine_expert_lightbox:/usr/src/redmine/plugins/redmine_expert_lightbox:ro" \
            redmine:${{ matrix.tag }}

      - name: Wait for Redmine to boot (migrations + init.rb load)
        run: |
          code=000
          for i in $(seq 1 60); do
            # If the container dies (failed migration / init.rb), fail right away.
            if [ "$(docker inspect -f '{{.State.Running}}' redmine 2>/dev/null)" != "true" ]; then
              echo "Redmine container exited early - dumping logs:"; docker logs redmine; exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            echo "attempt $i: GET /login -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "Timed out waiting for Redmine to serve /login"; docker logs redmine; exit 1; }

      # This plugin ships no migrations, so there is no migration banner to
      # grep for in the logs the way the sibling plugins do. Assert against the
      # rendered page instead, which is a stronger check anyway: it proves the
      # view hook ran and that the assets are actually reachable, not merely
      # that init.rb was parsed.
      - name: Assert the head hook injected the lightbox
        run: |
          curl -sS http://localhost:3000/login -o page.html
          fail() {
            echo "$1"
            sed -n '1,60p' page.html
            docker logs redmine
            exit 1
          }
          grep -q 'expert-lightbox-config' page.html \
            || fail "Rendered page has no config island - the head hook did not run:"
          # Redmine 6 and 7 fingerprint plugin assets (expert_lightbox-<digest>.js)
          # while 5.1 serves them under the plain name, so match the stem and let
          # the digest vary.
          grep -Eq 'expert_lightbox[^"]*\.js' page.html \
            || fail "Rendered page does not reference the lightbox script:"
          grep -Eq 'expert_lightbox[^"]*\.css' page.html \
            || fail "Rendered page does not reference the lightbox stylesheet:"
          echo "Head hook injected config island, script and stylesheet."

      - name: Assert the referenced assets are actually served
        run: |
          # Take the URLs out of the page rather than guessing them: both the
          # plugin_assets layout and the digest move between 5.1 and 7.0, and a
          # hard-coded path would test the guess instead of the plugin.
          grep -oE '/[^"]*expert_lightbox[^"]*\.(js|css)' page.html | sort -u > assets.txt
          [ -s assets.txt ] || { echo "No asset URLs in the page"; exit 1; }
          while read -r asset; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${asset}" || true)
            echo "GET ${asset} -> HTTP $code"
            [ "$code" = "200" ] || {
              echo "Plugin asset was not served"; docker logs redmine; exit 1; }
          done < assets.txt

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== redmine logs ====="; docker logs redmine 2>&1 || true
          echo "===== db logs ====="; docker logs db 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f redmine db 2>/dev/null || true
          docker network rm rmnet 2>/dev/null || true
